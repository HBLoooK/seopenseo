<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEOpenSEO | Free & Open SEO Intelligence Platform</title>
    <meta name="description" content="SEOpenSEO is the zero-cost open SEO intelligence suite. Audit technical site performance, research keywords, inspect SERP rankings, map internal PageRank, analyze backlinks, and optimize copy for AI Search (GEO)." />
    <meta name="keywords" content="free seo tools, open source seo, site audit, keyword research, serp analyzer, backlink checker, internal link pagerank, schema builder, generative engine optimization, geo search" />
    <meta name="author" content="SEOpenSEO" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Google AdSense Account Verification & Auto-Ads Ready -->
    <meta name="google-adsense-account" content="ca-pub-3493593869359820" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3493593869359820" crossorigin="anonymous"></script>

    <!-- GEO & AI Engine Optimization Meta -->
    <meta name="ai-search-index" content="allow" />
    <meta name="chatgpt-plugin" content="enabled" />
    <meta name="publisher" content="SEOpenSEO Intelligence Platform" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SEOpenSEO | Free & Open SEO Intelligence Platform" />
    <meta property="og:description" content="Audit sites, track keywords, analyze SERPs, check internal PageRank, and optimize content for AI & search engine visibility—100% free with open tools." />
    <meta property="og:site_name" content="SEOpenSEO" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SEOpenSEO | Free & Open SEO Intelligence Platform" />
    <meta name="twitter:description" content="Complete open-access SEO platform for technical audits, keyword difficulty, backlinks, and AI Generative Engine Optimization (GEO)." />

    <!-- JSON-LD Structured Data for Software Application & GEO Knowledge Graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SEOpenSEO",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Free & Open SEO Intelligence Platform offering technical site audits, keyword research, SERP analysis, backlink discovery, and Generative Engine Optimization (GEO).",
      "featureList": [
        "Technical Site Audit",
        "Keyword Research",
        "SERP & Snippet Simulator",
        "Backlink Explorer",
        "Internal Link & PageRank Calculator",
        "Content Gap Analysis",
        "On-Page Content Optimizer",
        "HTTP & SSL Inspector",
        "Schema JSON-LD Generator",
        "Robots & Sitemap Validator",
        "Generative Engine Optimization (GEO)"
      ]
    }
    </script>

    <!-- JSON-LD FAQ Schema for AI Search Citation (GEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is SEOpenSEO?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SEOpenSEO is a free, open platform that provides comprehensive SEO analysis including site health audits, keyword research, SERP rank tracking, internal PageRank calculation, and Generative Engine Optimization (GEO)."
          }
        },
        {
          "@type": "Question",
          "name": "How is SEOpenSEO free without subscription limits?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SEOpenSEO utilizes high-speed open-source HTML parsers, public web standards, and efficient client/server API routing rather than maintaining expensive paywalled crawlers."
          }
        },
        {
          "@type": "Question",
          "name": "What is Generative Engine Optimization (GEO)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GEO is the practice of optimizing content and site structure to maximize visibility and citations in AI search engines such as ChatGPT Search, Google Gemini, Perplexity, and Claude."
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
